events {
    worker_connections  1024;
}

http {
    include         mime.types;
    default_type    application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size     100m; # 允许客户端请求体的最大大小
    client_body_buffer_size  16m;  # 内存中缓存请求体的大小
    client_header_timeout    10m;  # 等待客户端发送完整请求头的超时时间
    client_body_timeout      1m;   # 等待客户端发送请求体的超时时间

    gzip on;
    gzip_static on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_comp_level  4;
    gzip_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_vary on;

    # ============================================================
    # HTTPS 全局配置
    # ============================================================

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    # ============================================================
    # 反向代理全局配置
    # ============================================================

    proxy_connect_timeout 5s; # 连接后端超时时间
    proxy_send_timeout 30s; # 向后端发送请求超时时间
    proxy_read_timeout 60s; # 等待后端响应超时时间

    # ============================================================
    # 后端服务集群
    # ============================================================

    upstream api_backend {
        server 127.0.0.1:8081;
        # server 82.157.133.87:8081; # max_fails=3 fail_timeout=30s
    }

    upstream druid_backend {
        server 127.0.0.1:8081;
    }

    # ============================================================
    # api.zblog.com
    # ============================================================

    server {
        listen  443 ssl;
        server_name  api.zblog.com;

        ssl_certificate /appuser/cert/ssl/api.zblog.com_bundle.crt;
        ssl_certificate_key /appuser/cert/ssl/api.zblog.com.key;

        location / {
            proxy_pass http://api_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # druid.zblog.com
    # ============================================================

    server {
        listen  443 ssl;
        server_name  druid.zblog.com;

        ssl_certificate /appuser/cert/ssl/druid.zblog.com_bundle.crt;
        ssl_certificate_key /appuser/cert/ssl/druid.zblog.com.key;

        location / {
            auth_basic "Druid Monitor";
            auth_basic_user_file /etc/nginx/.druid.htpasswd;

            proxy_pass http://druid_backend/druid/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect ~^https?://[^/]+/druid/(.*)$ /$1;
            proxy_redirect /druid/ /;
        }
    }

    # ============================================================
    # zblog.com www.zblog.com
    # ============================================================

    server {
        listen  443 ssl;
        server_name  zblog.com www.zblog.com;

        ssl_certificate /appuser/cert/ssl/zblog.com_bundle.crt;
        ssl_certificate_key /appuser/cert/ssl/zblog.com.key;

        location ^~ /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root   /appuser/app/web/zblog-web-portal/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============================================================
    # admin.zblog.com
    # ============================================================

    server {
        listen  443 ssl;
        server_name admin.zblog.com;

        ssl_certificate /appuser/cert/ssl/admin.zblog.com_bundle.crt;
        ssl_certificate_key /appuser/cert/ssl/admin.zblog.com.key;

        location ^~ /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 使用 druid 域名
        location = /druid/index.html {
            return 307 https://druid.zblog.com/;
        }

        # 不使用 druid 域名
        # location ^~ /druid/ {
        #     auth_basic "Druid Monitor";
        #     auth_basic_user_file /etc/nginx/.druid.htpasswd;
        # 
        #     proxy_pass http://druid_backend/druid/;
        # 
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location / {
            root   /appuser/app/web/zblog-web-admin/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============================================================
    # HTTP -> HTTPS
    # ============================================================

    server {
        listen       80;
        server_name  api.zblog.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  druid.zblog.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  zblog.com www.zblog.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen       80;
        server_name  admin.zblog.com;

        return 301 https://$host$request_uri;
    }
}
