##### Z-BLOG 配置 #####
zblog:
  base:
    # 线程池配置
    thread-pool:
      core-size: ${zblog.bas.thread.pool.coreSize} # 核心线程数
      max-size: ${zblog.bas.thread.pool.maxSize} # 最大线程数
      queue-capacity: ${zblog.bas.thread.pool.queueSize} # 任务队列容量
      keep-alive-seconds: ${zblog.bas.thread.pool.keepAliveSeconds} # 非核心线程空闲存活时间（秒），超过该时间未执行任务将被回收
      thread-name-prefix: ${zblog.bas.thread.pool.threadNamePrefix} # 线程名称前缀
      wait-for-tasks-to-complete-on-shutdown: ${zblog.bas.thread.pool.shutdown.waitForTasksToComplete} # 应用关闭时是否等待线程池中的任务执行完成，避免异步任务被直接中断
      await-termination-seconds: ${zblog.bas.thread.pool.shutdown.awaitTerminationSeconds} # 应用关闭时最多等待任务完成的时间（秒），超时后继续关闭
      monitor-enabled: ${zblog.bas.thread.pool.monitor.enabled} # 是否开启线程池运行状态监控日志
      monitor-interval: ${zblog.bas.thread.pool.monitor.interval} # 线程池监控日志打印间隔（毫秒）
    # 全局缓存配置
    cache:
      type: ${zblog.bas.cache.type} # 全局缓存类型，支持 memory 或 redis
    # 全局异常配置
    exception:
      error-code-config:
        check: true # 是否开启错误码格式检查
        scan-package: com.github.stazxr.zblog # 错误码扫描的起始包
    # 国际化配置
    i18n:
      cache-ttl: ${zblog.bas.i18n.cacheTtl} # 国际化消息缓存刷新周期，单位毫秒
      load-sql: SELECT code, message, locale FROM i18n_message # 从数据库加载国际化数据的 SQL 语句
      code-column: code # 数据库中 "code" 列名
      message-column: message # 数据库中 "message"（消息内容）列名
      locale-column: locale # 数据库中 "locale"（语言）列名
      basenames: # 本地资源文件的基础名列表（无扩展名）
        - messages/messages
        - ValidationMessages # 用户自定义的校验消息文件
        - ContributorValidationMessages # 允许约束定义的贡献者（Constraint Definition Contributor）提供一个自己的默认消息文件
        - org.hibernate.validator.ValidationMessages # Hibernate Validator 内置的默认消息文件
    # 邮件通知配置
    mail:
      from: # 发件人配置
        address: ${spring.mail.username} # 发件地址，务必与配置的邮件发送人保持一致
        name: ${spring.mail.from} # 发件人
        website:
          name: ${zblog.bas.mail.from.website.name} # 站点名称
          url: ${zblog.bas.mail.from.website.url} # 站点地址
    # 上下文配置
    context:
      sys-code: ST # 系统编码
      app-code: ZBLOG # 应用编码
      deploy:
        deploy-area: ${zblog.bas.context.deploy.area} # 部署地域，JVM 参数优先，否则使用数据库配置
        deploy-center: ${zblog.bas.context.deploy.center} # 部署机房/可用区，JVM 参数优先，否则使用数据库配置
        deploy-unit: ${zblog.bas.context.deploy.unit} # 部署单元，JVM 参数优先，否则使用数据库配置，默认 0
        deploy-ip: ${zblog.bas.context.deploy.ip} # 部署 IP，JVM 参数优先，否则自动获取本机 IP
      tags: # 自定义标签配置
        - { tag-name: x-client-type } # 客户端类型：01 - 移动端，02 - PC端
        - { tag-name: x-visitor-id } # 访客id
        - { tag-name: x-page-path } # 前端页面路由
        - { tag-name: x-page-title } # 前端页面标题
        - { tag-name: x-page-type } # 前端页面类型
    # 序号配置
    sequence:
      datacenter-id: ${zblog.bas.sequence.datacenter.id} # Snowflake 数据中心编号
      machine-id: ${zblog.base.context.deploy.deploy-unit} # Snowflake 机器编号，默认使用部署单元编号
    # 日志打印配置 TODO 待优化
    log:
      control:
        enabled: true # 开启全局请求响应日志打印
        model: 1 # 模式: 1-白名单模式；2-黑名单模式
        paths:
    # 文件存储配置
    file:
      storage-type: ${zblog.bas.file.storage.type} # 存储类型，1-本地；2-阿里云；3-七牛云；4-腾讯云
      local:
        enabled: ${zblog.bas.file.local.enabled} # 是否启用本地存储
        file-access-url: ${zblog.bas.file.local.fileAccessUrl} # 本地文件访问 URL 前缀
        storage-path-prefix: ${zblog.bas.file.local.storagePathPrefix} # 本地文件存储路径前缀
      oss:
        enabled: ${zblog.bas.file.oss.enabled} # 是否启用阿里云 OSS 对象存储
        file-access-url: ${zblog.bas.file.oss.fileAccessUrl} # 阿里云 OSS 文件访问 URL 前缀
        storage-path-prefix: ${zblog.bas.file.oss.storagePathPrefix} # 阿里云 OSS 文件存储路径前缀
        access-key: ${zblog.bas.file.oss.accessKey} # 阿里云 AccessKey ID
        secret-key: ${zblog.bas.file.oss.secretKey} # 阿里云 AccessKey Secret
        endpoint: ${zblog.bas.file.oss.endpoint} # 阿里云 OSS Endpoint
        bucket-name: ${zblog.bas.file.oss.bucketName} # 阿里云 OSS 存储桶名称
      kodo:
        enabled: ${zblog.bas.file.kodo.enabled} # 是否启用七牛云 Kodo 对象存储
        file-access-url: ${zblog.bas.file.kodo.fileAccessUrl} # 七牛云 Kodo 文件访问 URL
        storage-path-prefix: ${zblog.bas.file.kodo.storagePathPrefix} # 七牛云 Kodo 文件存储路径前缀
        access-key: ${zblog.bas.file.kodo.accessKey} # 七牛云 AccessKey（AK）
        secret-key: ${zblog.bas.file.kodo.secretKey} # 七牛云 SecretKey（SK）
        zone: ${zblog.bas.file.kodo.zone} # 七牛云存储区域
        zone-name: ${zblog.bas.file.kodo.zoneName} # 七牛云存储空间名称
      cos:
        enabled: ${zblog.bas.file.cos.enabled} # 是否启用腾讯云 COS 对象存储
        file-access-url: ${zblog.bas.file.cos.fileAccessUrl} # 腾讯云 COS 文件访问 URL 前缀
        storage-path-prefix: ${zblog.bas.file.cos.storagePathPrefix} # 腾讯云 COS 文件存储路径前缀
        access-key: ${zblog.bas.file.cos.accessKey} # 腾讯云访问密钥 ID
        secret-key: ${zblog.bas.file.cos.secretKey} # 腾讯云访问密钥 SecretKey
        region: ${zblog.bas.file.cos.region} # 腾讯云 COS 所在地域
        bucket-name: ${zblog.bas.file.cos.bucketName} # 腾讯云 COS 存储桶名称
    # 统一响应配置 TODO 待优化
    rest:
      error-path: /error # 错误路径
      not-package-uris: # 不进行统一包装的 URI 列表
        - /swagger-resources
        - /v3/api-docs
        - /v2/api-docs
    # CORS 配置
    cors:
      allowed-origin-patterns: ${zblog.bas.cors.allowedOriginPatterns} # 允许的跨域来源，多个逗号分割
    # Security 配置
    security:
      login-url: /api/login # 登录接口 URL
      logout-url: /api/logout # 登出接口 URL
      password-limited-day: ${zblog.bas.security.password.limitedDay} # 密码有效天数（天），默认90天
      password-history-count: ${zblog.bas.security.password.historyCount} # 新密码不能与最近X次密码重复，-1表示关闭校验
      enable-additional-checks: ${zblog.bas.security.enableAdditionalChecks} # 是否启用额外登录认证校验
      lock-config: # 账号锁定配置
        max-fail-count: ${zblog.bas.security.lock.maxFailCount} # 允许登录失败最大次数，0表示不锁定
        lock-duration: ${zblog.bas.security.lock.duration} # 账号锁定时长，ISO-8601 Duration 格式，例如 PT5M 表示 5 分钟
      jwt: # JWT 配置
        access-token-ttl: ${zblog.bas.security.jwt.accessTokenTtl} # 访问令牌有效时间（秒），默认 1800 秒（30分钟）
        refresh-token-ttl: ${zblog.bas.security.jwt.refreshTokenTtl} # 刷新令牌有效时间（秒），默认 604800 秒（7天）
        allowed-renew-token: ${zblog.bas.security.jwt.allowedRenewToken} # 是否允许续签，默认 false
        check-ip-change: ${zblog.bas.security.jwt.checkIpChange} # 是否检查IP变化
        algorithm: RS256 # JWT签名算法，参考 com.nimbusds.jose.JWSAlgorithm
        cert-info: # JWT 签名证书配置
          alias: ${zblog.bas.security.jwt.cert.alias} # 证书别名
          key-password: ${zblog.bas.security.jwt.cert.keyPassword} # 证书密钥密码
          cert-location: ${zblog.bas.security.jwt.cert.location} # 证书文件路径
        claims: # JWT Claims 配置
          issuer: ${zblog.bas.security.jwt.claims.issuer} # JWT签发者
          audience: ${zblog.bas.security.jwt.claims.issuer} # JWT接收方
        cookie: # JWT Cookie 配置
          domain: ${zblog.bas.security.jwt.cookie.domain} # Cookie 域名
          secure: ${zblog.bas.security.jwt.cookie.secure} # 是否仅允许 HTTPS 传输 Cookie
          http-only: ${zblog.bas.security.jwt.cookie.httpOnly} # 是否禁止 JavaScript 访问 Cookie
          same-site: ${zblog.bas.security.jwt.cookie.sameSite} # Cookie SameSite 策略：Strict、Lax、None
          path: ${zblog.bas.security.jwt.cookie.path} # Access Token Cookie 生效路径
          refresh-path: ${zblog.bas.security.jwt.cookie.refreshPath} # Refresh Token Cookie 生效路径
    # Swagger 配置
    swagger:
      enable: ${zblog.bas.swagger.enable} # 是否启用接口文档
      title: ${zblog.bas.swagger.title} # 接口文档标题
      description: ${zblog.bas.swagger.description} # 接口文档描述
      server-url: ${zblog.bas.swagger.serverUrl} # 服务地址
      version: ${zblog.bas.swagger.version} # 接口文档版本
      contact:
        name: ${zblog.bas.swagger.contact.name} # 联系人姓名
        email: ${zblog.bas.swagger.contact.email} # 联系人邮箱
        url: ${zblog.bas.swagger.contact.url} # 联系人主页
  # 切面日志配置
  aop-log:
    enabled: ${zblog.bas.aopLog.enabled} # 是否启用切面日志
    async: ${zblog.bas.aopLog.async} # 是否开启异步日志写入
    record-param: ${zblog.bas.aopLog.recordParam} # 是否记录接口请求参数
    record-result: ${zblog.bas.aopLog.recordResult} # 是否记录接口返回值
    max-param-length: ${zblog.bas.aopLog.maxParamLength} # 记录的最大参数长度，超过部分将被截断
    max-result-length: ${zblog.bas.aopLog.maxResultLength} # 记录的最大返回长度，超过部分将被截断
  # websocket 配置
  websocket:
    endpoint: /ws # WebSocket Endpoint
    broker-prefix: /topic # Broker 前缀
    allowed-origin-patterns: ${zblog.bas.websocket.allowedOriginPatterns} # 允许跨域配置，多个地址逗号分割
