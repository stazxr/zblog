server:
  port: ${SERVER_PORT:8081} # 应用端口
  tomcat:
    max-swallow-size: -1 # 不限制吞吐大小

spring:
  application:
    name: zblog # 应用名称
  profiles:
    include: props,audit
  main:
    allow-bean-definition-overriding: false # 是否允许覆盖BEAN
    allow-circular-references: false # 是否允许循环依赖，不建议开启
  web:
    resources:
      add-mappings: false # 关闭 Spring Boot 默认静态资源映射 classpath:/META-INF/resources/，classpath:/resources/，classpath:/static/，classpath:/public/
  mvc:
    throw-exception-if-no-handler-found: true # 访问不存在接口，是否抛出异常
    pathmatch:
      matching-strategy: ant_path_matcher
  freemarker:
    check-template-location: false # 是否检查 classpath:/templates/ 是否存在
  thymeleaf: # thymeleaf 模板引擎配置
    prefix: classpath:/templates/
    suffix: .ftl
  servlet:
    multipart:
      enabled: true # 开启 Multipart 文件上传支持
      max-file-size: ${zblog.multipart.maxFileSize} # 限制单个文件上传大小
      max-request-size: ${zblog.multipart.maxRequestSize} # 整个 HTTP multipart 请求大小，如多文件，一般 max-request-size >= max-file-size
      file-size-threshold: ${zblog.multipart.fileSizeThreshold} # 上传文件时，没超过这个值，写入内存，超过则写入磁盘
      location: ${zblog.multipart.location} # 临时文件的存放目录，linux场景下某些系统 /tmp 目录很小，需要重新客户化这个参数

  # 数据库配置
  datasource:
    druid:
      # 基本信息
      driver-class-name: ${zblog.database.driver} # 数据库驱动
      url: ${zblog.database.url} # 数据库连接
      username: ${zblog.database.username} # 数据库用户名
      password: ${zblog.database.password} # 数据库密码

      # ============================================================
      # 连接池大小
      # ============================================================

      initial-size: ${zblog.database.pool.initialSize} # 连接池的初始连接数，建议 InitialSize ≥ MinIdle
      min-idle: ${zblog.database.pool.minIdle} # 连接池的最小连接数
      max-active: ${zblog.database.pool.maxActive} # 连接池的最大连接数
      max-wait: ${zblog.database.pool.maxWait} # 连接池的最大等待时间（毫秒），当连接池已无可用连接时，线程最多等待该时间，超时后仍未获取到连接，则抛出获取连接超时异常

      # ============================================================
      # 连接有效性检查
      # ============================================================

      validation-query: select 1 # 检测连接是否有效
      test-while-idle: true # 指明连接是否被空闲连接回收器（如果有）进行检验。 如果检测失败，则连接将被从池中去除
      test-on-borrow: false # 指明是否在从池中取出连接前进行检验，如果检验失败，则从池中去除连接并尝试取出另一个，关闭可以减少检测开销
      test-on-return: false # 是否在归还到池中前进行检验
      time-between-eviction-runs-millis: 60000 # 空闲连接检测任务的执行周期（毫秒）
      max-evictable-idle-time-millis: 300000 # 连接池的最大生存时间（毫秒）
      min-evictable-idle-time-millis: 1800000 # 连接池的最小生存时间（毫秒），当连接池已无可用连接时，线程最多等待该时间

      # ============================================================
      # 连接泄漏检测
      # ============================================================

      log-abandoned: false # 打印堆栈，方便排查
      remove-abandoned: false # 当连接池中的某个连接被应用程序借出后长时间没有归还，Druid 会认为这个连接“被遗弃”，并自动回收
      remove-abandoned-timeout: 300 # 指定连接被认为“被遗弃”的时间阈值，单位是毫秒。一般建议 比最大可能执行的 SQL 时长稍大，避免误回收正在执行的合法连接

      # ============================================================
      # PSCache
      # ============================================================

      pool-prepared-statements: false # MySQL 不建议开启 PSCache，对 Oracle 等数据库更有价值
      # max-pool-prepared-statement-per-connection-size: 10

      # ============================================================
      # Druid 监控配置
      # ============================================================

      stat-view-servlet:
        enabled: ${zblog.database.druid.page.enabled} # 是否启用 Druid Web 监控页面，生产环境建议仅在确有监控需求时开启，并配合 Nginx 做访问控制
        url-pattern: /druid/* # Druid 监控页面访问路径，http(s)://域名/druid/
        login-username: ${zblog.database.druid.page.loginUsername} # Druid 监控页面登录用户名
        login-password: ${zblog.database.druid.page.loginPassword} # Druid 监控页面登录密码
        reset-enable: false # 是否允许在监控页面重置统计数据，生产环境建议关闭，避免误操作清除监控统计
        allow: # 允许访问监控页面的 IP 地址，多个 IP 使用逗号分隔，为空表示不额外限制允许的 IP，建议结合 Nginx 的 allow/deny 统一进行访问控制
        deny: # 禁止访问监控页面的 IP 地址（优先于 allow），多个 IP 使用逗号分隔，与 allow 同时配置时，需注意 Druid 自身的访问控制规则

      # ============================================================
      # Web 应用监控
      # ============================================================

      web-stat-filter:
        enabled: true # 启用统计和监控 Web 应用程序的请求和响应数据
        url-pattern: /api/* # 配置监控的 URL 映射
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico' # 设置不需要统计的 URL

      # ============================================================
      # Druid Filter
      # ============================================================

      filter:
        stat: # SQL 监控配置
          enabled: true
          log-slow-sql: true # 打印慢SQL
          slow-sql-millis: ${zblog.database.slowSqlMills} # 慢SQL阙值（毫秒），根据项目情况按需调整
          merge-sql: true # 合并 SQL 查询
          db-type: mysql # 数据库类型

        slf4j: # SQL 日志配置
          enabled: false

        wall: # SQL防火墙配置
          enabled: true
          config:
            comment-allow: false # 是否允许 SQL 注释，防止通过注释绕过防火墙
            drop-table-allow: false # 不允许删除表
            truncate-allow: false # 禁止 TRUNCATE TABLE
            none-base-statement-allow: false # 是否允许非基础 SQL
            multi-statement-allow: false # 指定是否允许在一个 Statement 对象中执行多个 SQL 语句
            strict-syntax-check: true # 严格检查 SQL 语法，发现危险 SQL 就拦截

  # redis 配置
  redis:
    database: ${zblog.redis.database} # 指定 Redis 使用的数据库索引，Redis 默认有 16 个数据库，索引从 0 到 15
    host: ${zblog.redis.host} # Redis 服务器地址
    port: ${zblog.redis.port} # Redis 服务器的端口号
    password: ${zblog.redis.password} # Redis 服务器的密码
    connect-timeout: ${zblog.redis.connect.timeout} # 建立 TCP 连接超时时间，单位为毫秒，用于定义客户端连接到 Redis 服务器的最大等待时间
    timeout: ${zblog.redis.read.timeout} # Redis 命令执行等待时间
    client-type: lettuce
    lettuce:
      pool:
        # 连接池中保持的最小空闲连接数
        min-idle: ${zblog.redis.lettuce.pool.minIdle}
        # 连接池中允许的最大空闲连接数
        max-idle: ${zblog.redis.lettuce.pool.maxIdle}
        # 连接池中允许的最大活动连接数，如果活动连接数超过此值，将会有新的连接请求被阻塞或抛出异常
        max-active: ${zblog.redis.lettuce.pool.maxActive}
        # 从连接池中获取连接时的最大等待时间，单位为毫秒。如果超过此时间仍未获取到连接，将会抛出异常
        max-wait: ${zblog.redis.lettuce.pool.maxWait}
        # 连接池中连接的清理周期，单位为毫秒。用于定义多长时间执行一次空闲连接的检查和清理，以保持连接池的健康
        time-between-eviction-runs: ${zblog.redis.lettuce.pool.timeBetweenEvictionRuns}

  # 邮箱配置
  mail:
    host: ${zblog.email.host} # 邮箱服务器
    port: ${zblog.email.port} # 邮箱服务器端口 25/465/587
    username: ${zblog.email.username} # 邮箱用户
    password: ${zblog.email.password} # 邮箱授权码（非登录密码）
    properties:
      mail:
        smtp:
          auth: true
          ssl: # 465
            enable: true # 启用 SSL/TLS 加密
            required: true # 所有与 SMTP 服务器的连接是否都必须使用 SSL/TLS 加密
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          # starttls: # 587
            # enable: true # 启用 STARTTLS 协议。如果服务器支持 STARTTLS，这将会启用加密连接
            # required: true # 强制要求使用 STARTTLS 协议。如果 SMTP 服务器不支持 STARTTLS，连接将失败

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml # 配置 Mapper XML 文件位置
  configuration:
    map-underscore-to-camel-case: true # 开启自动驼峰映射
